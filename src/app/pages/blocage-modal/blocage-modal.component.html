<div *ngIf="showModal" (click)="$event.stopPropagation()" class="modal">
    <div class="modal-content">
      <div class="modal-icon">
        <span>&#10060;</span>
      </div>
      <p>Êtes-vous sûr de vouloir {{ user?.status === 'inactive' ? 'débloquer' : 'bloquer' }} cet utilisateur ?</p>
      <div class="modal-buttons">
        <button class="btn confirm" (click)="onConfirm()">Confirmer</button>
        <button class="btn cancel" (click)="onCancel()">Annuler</button>
      </div>
    </div>
  </div>
