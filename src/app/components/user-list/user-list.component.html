<div class="container">
  <h1>Gestion des utilisateurs</h1>
  <div class="d-flex justify-content-end mb-3"> <!-- Utilisez justify-content-end pour aligner à droite -->
    <button class="btn btn-add" (click)="openModal()">
      <i class="fas fa-plus"></i> Ajouter un utilisateur
    </button>
    <app-inscription-modal *ngIf="isModalOpen" (close)="closeModal()"></app-inscription-modal>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>
          <input type="checkbox" (change)="toggleSelectAll($event)" />
        </th>
        <th>Nom</th>
        <th>ID de l'utilisateur</th>
        <th>Email</th>
        <th>Status</th>
        <th>assignation</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>
          <input type="checkbox" [(ngModel)]="user.selected" />
        </td>
        <td>{{ user.name }}</td>
        <td>{{ user.cardId }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.status }}</td>
        <td>
          <button [ngClass]="{'btn-outline-success': user.assignation === 'assigner une carte', ' btn-outline-danger': user.assignation === 'désassigner la carte'}" (click)="openModalA(user.id)">
            {{ user.assignation }}
          </button>
          <app-assign-card *ngIf="isModalAOpen" [isVisible]="isModalAOpen" [userId]="selectedUserId"></app-assign-card>
        </td>
        <td>
          <button class="btn ms-2" (click)="openModalM(user.id)" title="Modifier">
            <i class="fas fa-pencil-alt"></i>
        
          </button>
          <app-modification-modal *ngIf="isModalMOpen" [userId]="selectedUserId" (close)="closeModalM()"></app-modification-modal>
          <button class="btn ms-2" (click)="openModalS(user.id)" title="Supprimer">
            <i class="fas fa-trash"></i>
            
          </button>
          <app-suppression-modal *ngIf="isModalSOpen" [userId]="selectedUserId" (close)="closeModalS()"></app-suppression-modal>
          <button class="btn ms-2" (click)="openModalB(user.id)" title="Bloquer">
            <i class="fas fa-ban"></i>
            
          </button>
          <app-blocage-modal *ngIf="isModalBOpen" [userId]="selectedUserId" (close)="closeModalB()"></app-blocage-modal>
        </td>
      </tr>
    </tbody>
  </table>
</div>
