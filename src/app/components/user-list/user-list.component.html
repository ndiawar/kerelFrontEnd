<div class="container">
  <h1>Gestion des utilisateurs</h1>
  <div class="d-flex justify-content-end mb-3"> <!-- Utilisez justify-content-end pour aligner à droite -->
    <button class="btn btn-add" (click)="openModal()">
      <i class="fas fa-plus"></i> Ajouter un utilisateur
    </button>
    <app-inscription-modal *ngIf="isModalOpen" (close)="closeModal()"></app-inscription-modal>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>
          <input type="checkbox" (change)="toggleSelectAll($event)" />
        </th>
        <th>Nom</th>
        <th>ID de l'utilisateur</th>
        <th>Email</th>
        <th>assignation</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>
          <input type="checkbox" [(ngModel)]="user.selected" />
        </td>
        <td>{{ user.name }}</td>
        <td>{{ user.cardId }}</td>
        <td>{{ user.email }}</td>
        <td>
          <button [ngClass]="{'text-success': user.assignation === 'assigner une carte', 'text-danger': user.assignation === 'désassigner la carte'}">
            {{ user.assignation }}
          </button>
        </td>
        <td>
          <button class="btn btn-warning" (click)="openModalM()" title="Modifier">
            <i class="fas fa-pencil-alt"></i>
        
          </button>
          <app-modification-modal *ngIf="isModalMOpen" (close)="closeModalM()"></app-modification-modal>
          <button class="btn btn-danger" (click)="openModalS()" title="Supprimer">
            <i class="fas fa-trash"></i>
            
          </button>
          <app-suppression-modal *ngIf="isModalSOpen" (confirm)="onConfirmDelete()" (close)="closeModalS()"></app-suppression-modal>
          <button class="btn btn-secondary" (click)="openModalB()" title="Bloquer">
            <i class="fas fa-ban"></i>
            
          </button>
          <app-blocage-modal *ngIf="isModalBOpen" (confirm)="onConfirmBloq()" (close)="closeModalB()"></app-blocage-modal>
        </td>
      </tr>
    </tbody>
  </table>
</div>
