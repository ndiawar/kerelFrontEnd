<div class="container">
    <h1>Historique des actions</h1>
    <div class="search-bar mb-3">
        <label class="search-label">
          <input
            type="text"
            placeholder="Rechercher par nom, prénom, date ..."
            class="form-control search-input"
            [(ngModel)]="searchTerm"
          />
          <i class="fas fa-search search-icon"></i>
        </label>
      </div>
  
    <table class="table">
      <thead>
        <tr>
          <th>ID de l'utilisateur</th>
          <th>Nom</th>
          <th>Action effectuée</th>
          <th>Heure</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let action of filteredActions"> <!-- Utilisation de filteredActions -->
          <td>{{ action.user_id }}</td>
          <td>{{ action.prenom }} {{ action.nom }}</td>
          <td>{{ action.Action }}</td>
          <td>{{ formatTime(action.created_at) }}</td>
          <td>{{ formatDate(action.created_at) }}</td>
        </tr>
      </tbody>
    </table>
  </div>
