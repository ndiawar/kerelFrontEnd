<div class="dashboard">
  <!-- Carte météo -->
  <div class="card weather-card">
    <p class="location">Fatick, Sénégal</p>
    <h2>Mercredi</h2>
    <p>29 Janvier 2025</p>
    <div class="temperature">
      <h1>58°C</h1>
      <p>/24°C</p>
    </div>
    <img src="assets/images/Rain cloud.png" alt="Pluie">
    <p class="description">Pluie Abondante</p>

  </div>

  <!-- Informations sur l'humidité et la température -->
  <div class="card stats">
    <div class="stat-card">🌊 Volume Eau :<br> <strong>790L</strong></div>
    <div class="stat-card">💧 Humidité :<br> <strong>85%</strong></div>
    <div class="stat-card">🌱 pH du sol :<br> <strong>4.8</strong></div>
    <div class="stat-card">🌡️ Temp. :<br> <strong>25°C</strong></div>
  </div>
<!-- Contrôles d'arrosage et lumière -->
<div class="card watering-controls">
  <label class="switch">
    <span class="label-text">💦 Arrosage</span> <!-- Texte pour l'arrosage -->
    <span
      class="slider"
      [ngClass]="{ active: isWateringOn }"
      (click)="toggleSlider('watering')"
    ></span> <!-- Slider -->
  </label>
  <label class="switch">
    <span class="label-text">💡 Lumière</span> <!-- Texte pour la lumière -->
    <span
      class="slider"
      [ngClass]="{ active: isLightOn }"
      (click)="toggleSlider('light')"
    ></span> <!-- Slider -->
  </label>
</div>

  <!-- Section Actions -->
  <div class="card actions">
    <h3>Actions</h3>
    <ul>
      <li>1. Yaye Fatou Kane</li>
      <li>2. Oumou Khairy Ndiaye</li>
      <li>3. Ndiawar Diop</li>
      <li>4. Abdul Rahmane Sow</li>
    </ul>
  </div>

  <div class="card card-chart">
    <div class="charts">
      <div class="chart">
        <canvas id="chart1"></canvas> <!-- Graphique 1 -->
      </div>
      <div class="chart">
        <canvas id="chart2"></canvas> <!-- Graphique 2 -->
      </div>
    </div>
  </div>
</div>
